# IP của từng máy chạy Server (điền Public IP EC2 thật vào đây)
server1.host=127.0.0.1
server2.host=127.0.0.1
server3.host=127.0.0.1
server4.host=127.0.0.1

# Port của từng Server
server1.port=2001
server2.port=2002
server3.port=2003
server4.port=2004

# Số server trong hệ thống
server.count=4

# MySQL local của từng server (mỗi máy kết nối DB của chính nó)
db.url=jdbc:mysql://localhost:3306/dtdm
db.user=root
db.password=

# Tên bảng dữ liệu (mỗi server dùng bảng riêng: server1, server2, ...)
