# =============================================
# PARKING SYNC SERVER - CONFIGURATION
# Override SERVER_ID, SERVER_PORT, DB_PORT khi chạy mỗi instance
# =============================================

# Server identity (override khi chạy: -DSERVER_ID=1)
server.id=${SERVER_ID:1}
server.port=8081

# Datasource (mỗi server dùng DB riêng)
spring.datasource.url=jdbc:mysql://localhost:3306/parking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Peer servers để sync (danh sách các server khác, trừ chính nó)
# Format: server1_url,server2_url,...
sync.peer.urls=${SYNC_PEERS:http://localhost:8082,http://localhost:8083,http://localhost:8084}

# Sync timeout (ms)
sync.timeout.ms=5000

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}

# Logging
logging.level.com.parking=DEBUG
logging.level.org.springframework.web.socket=INFO
